name: publish-npm

# 打版本标签（v*）时自动发布到 npm。
# 用法：bump package.json 版本 → 提交 → git tag vX.Y.Z → git push origin vX.Y.Z
#
# 凭据：secrets.NPM_TOKEN（仓库 Settings → Secrets and variables → Actions）。
# 该 token 必须是 npm 的 Automation 类型（classic）或勾选了 Bypass 2FA 的
# granular token，否则 CI 发布会因 2FA 被拒（403）。token 永不出现在本文件或代码里。

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}; aborting" >&2
            exit 1
          fi
          echo "publishing dsh-plugin-toggle@${PKG_VERSION}"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
