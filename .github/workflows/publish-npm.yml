name: publish-npm

# 打版本标签（v*）时自动发布到 npm —— 使用 npm Trusted Publishing（OIDC），
# 不需要也不使用任何 npm token：npm 通过 GitHub OIDC 直接核验本仓库后发放短期凭证。
#
# 用法：bump package.json 版本 → 提交 → git tag vX.Y.Z → git push origin vX.Y.Z
#
# 首次配置（一次性，npm 侧）：
#   https://www.npmjs.com/package/dsh-plugin-toggle → Settings → Trusted Publishing
#   → Connect a publisher → GitHub Actions → 仓库 huntersxy/dsh-plugin-toggle，
#   工作流名填 publish-npm.yml（或留空允许任意）→ 保存。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write      # OIDC：npm Trusted Publishing 换取短期发布凭证
  attestations: write  # provenance（SLSA）签名写入

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}; aborting" >&2
            exit 1
          fi
          echo "publishing dsh-plugin-toggle@${PKG_VERSION}"

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --provenance
